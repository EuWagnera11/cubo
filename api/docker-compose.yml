# Cubo Studio API — Docker Compose (Supabase managed DB)
# Sobe FastAPI + Celery worker + Celery beat + Redis + Caddy.
# Postgres NÃO está aqui — usamos Supabase managed (DATABASE_URL no .env).
#
# Uso no VPS:
#   1. cd /opt/cubo
#   2. cp api/.env.production.template .env && nano .env (preencher)
#   3. docker compose -f api/docker-compose.yml up -d
#
# Logs:    docker compose logs -f api
# Update:  git pull && docker compose up -d --build

services:
  # ──────────────────────────────────────────────────────
  # API (FastAPI)
  # ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: cubo-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cubo-net

  # ──────────────────────────────────────────────────────
  # Celery worker (jobs assíncronos)
  # ──────────────────────────────────────────────────────
  worker:
    build: .
    container_name: cubo-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A api.workers:celery_app worker --loglevel=info --concurrency=4
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cubo-net

  # ──────────────────────────────────────────────────────
  # Celery beat (scheduler de tasks periódicas)
  # ──────────────────────────────────────────────────────
  beat:
    build: .
    container_name: cubo-beat
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A api.workers:celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cubo-net

  # ──────────────────────────────────────────────────────
  # Redis (Celery broker + cache)
  # ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cubo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cubo-net

  # ──────────────────────────────────────────────────────
  # Caddy (reverse proxy + SSL automático Let's Encrypt)
  # ──────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: cubo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cubo-net

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  cubo-net:
    driver: bridge
